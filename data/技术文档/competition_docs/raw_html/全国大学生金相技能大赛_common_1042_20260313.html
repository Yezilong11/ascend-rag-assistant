:"","ssr_data":{"article_1042":{"id":1042,"title":"关于设置大赛官网登录账号的通知","title1":null,"create_at":"2025-04-15T10:55:46.000Z","status":1,"update_at":"2025-04-15T10:55:00.000Z","key":null,"keywords":null,"manager":{"id":2,"name":"龚江宏","sex":1,"description":null},"category":{"id":122,"title":"其他文章"},"images":[],"attachments":[],"layout":null,"html_content":"[{\"content\":\"\u003Chr size=\\\"1\\\"\u003E\u003Cp class=\\\"ql-first2space-on ql-align-justify\\\"\u003E\u003Cbr\u003E\u003C\u002Fp\u003E\u003Cp class=\\\"ql-first2space-on ql-align-justify\\\"\u003E\u003Cstrong style=\\\"color: rgb(230, 0, 0);\\\"\u003E重要通知：\u003C\u002Fstrong\u003E全国大学生金相技能大赛获奖证书电子版的下载功能布置在官网的教师个人专区。第十届大赛以来的历届大赛指导教师均可以在大赛官网注册 ，并向大赛秘书处申请开通教师个人专区。\u003C\u002Fp\u003E\u003Cp class=\\\"ql-first2space-on ql-align-justify\\\"\u003E\u003Cbr\u003E\u003C\u002Fp\u003E\u003Chr size=\\\"1\\\"\u003E\u003Cp class=\\\"ql-first2space-on ql-align-justify\\\"\u003E\u003Cbr\u003E\u003C\u002Fp\u003E\u003Cp class=\\\"ql-first2space-on ql-align-justify\\\"\u003E最近，金相大赛官网更新了用户登录及重置登录密码的办法，并增加了指导教师自主注册的功能。现就相关细节通知如下。\u003C\u002Fp\u003E\u003Cp class=\\\"ql-first2space-on ql-align-justify\\\"\u003E\u003Cbr\u003E\u003C\u002Fp\u003E\u003Cp class=\\\"ql-first2space-on ql-align-justify\\\"\u003E\u003Cstrong\u003E一、账号注册\u003C\u002Fstrong\u003E\u003C\u002Fp\u003E\u003Cp class=\\\"ql-first2space-on ql-align-justify\\\"\u003E点击大赛官网右上角的“登录”，在弹出的小窗口中点击“注册”，按步骤输入信息即可完成注册过程。\u003C\u002Fp\u003E\u003Cp class=\\\"ql-first2space-on ql-align-justify\\\"\u003E\u003Cstrong style=\\\"color: rgb(230, 0, 0);\\\"\u003E友情提示：\u003C\u002Fstrong\u003E在注册过程中，如果遇到类似于“该手机号已经注册”的系统提示，请\u003Cstrong style=\\\"color: rgb(0, 102, 204);\\\"\u003E微信联系\u003C\u002Fstrong\u003E大赛秘书处索取初始密码。\u003C\u002Fp\u003E\u003Cp class=\\\"ql-first2space-on ql-align-justify\\\"\u003E\u003Cstrong style=\\\"color: rgb(230, 0, 0);\\\"\u003E友情提示：\u003C\u002Fstrong\u003E新增的注册功能原则上仅限大赛指导教师使用。不建议参加金相大会(第二赛道)和分析大赛(第三赛道)的选手自行注册。\u003C\u002Fp\u003E\u003Cp class=\\\"ql-first2space-on ql-align-justify\\\"\u003E\u003Cbr\u003E\u003C\u002Fp\u003E\u003Cp class=\\\"ql-first2space-on ql-align-justify\\\"\u003E\u003Cstrong\u003E二、重置密码\u003C\u002Fstrong\u003E\u003C\u002Fp\u003E\u003Cp class=\\\"ql-first2space-on ql-align-justify\\\"\u003E大赛官网目前为注册用户设置了两种重置密码的方法。一是使用预设问题重置，二是使用初始密码重置。\u003C\u002Fp\u003E\u003Cp class=\\\"ql-first2space-on ql-align-justify\\\"\u003E\u003Cspan style=\\\"color: rgb(230, 0, 0);\\\"\u003E“使用初始密码重置”\u003C\u002Fspan\u003E是一个过渡性的临时措施，适用于在2025年4月28日之前已经由大赛秘书处创建的账号以及参加金相大会(第二赛道)和分析大赛(第三赛道)的选手。这些用户如果忘记了初始密码，请及时联系大赛秘书处索取。\u003C\u002Fp\u003E\u003Cp class=\\\"ql-first2space-on ql-align-justify\\\"\u003E\u003Cspan style=\\\"color: rgb(230, 0, 0);\\\"\u003E“使用预设问题重置”\u003C\u002Fspan\u003E是用户自主重置密码的主要措施。在忘记了密码的情况下，点击重置密码部分的“使用预设问题重置”，回答包括隐私问题在内的所有问题之后即可重置密码。\u003C\u002Fp\u003E\u003Cp class=\\\"ql-first2space-on ql-align-justify\\\"\u003E\u003Cstrong\u003E关于隐私问题：\u003C\u002Fstrong\u003E自2025年4月28日起，用户登录大赛官网账号时，登录将包括两个步骤：点击大赛官网右上角的“登录”，在弹出的小窗口中输入手机号和密码并点击“登录”后，将弹出一个新的小窗口请用户核对信息，其中包括了两个预设的隐私问题及相应的答案；隐私问题及答案均由用户自行设计并录入。\u003C\u002Fp\u003E\u003Cp class=\\\"ql-first2space-on ql-align-justify\\\"\u003E\u003Cbr\u003E\u003C\u002Fp\u003E\u003Chr size=\\\"1\\\"\u003E\u003Cp class=\\\"ql-first2space-on ql-align-justify\\\"\u003E\u003Cbr\u003E\u003C\u002Fp\u003E\u003Cp class=\\\"ql-first2space-on ql-align-justify\\\"\u003E\u003Cstrong style=\\\"color: rgb(230, 0, 0);\\\"\u003E请指导教师关注：\u003C\u002Fstrong\u003E本网站为全国大学生金相技能大赛指导教师开辟了“指导教师专区”。在“指导教师专区”，指导教师可以查找、收藏或下载全国大学生金相技能大赛自第五届以来的所有电子版证书，查询本人历届参赛情况及备案情况。此外，“指导教师专区”还为指导教师提供一些其他的服务。\u003C\u002Fp\u003E\u003Cp class=\\\"ql-first2space-on ql-align-justify\\\"\u003E需要开通“指导教师专区”的老师可以自行在大赛官网注册，注册后请联系大赛秘书处开通指导教师专区。如果手机号已经注册，请\u003Cstrong style=\\\"color: rgb(230, 0, 0);\\\"\u003E微信联系\u003C\u002Fstrong\u003E大赛秘书处索取初始密码。\u003C\u002Fp\u003E\u003Cp class=\\\"ql-first2space-on ql-align-justify\\\"\u003E在完成注册并经大赛秘书处同意开通指导教师专区之后，指导教师点击页面右上角的“登录”，输入账号 (本人手机号) 和密码并点击登录，页面右上角“登录”位置处将转变为显示登录人的姓名；登录人姓名下方同时出现一个“教师个人专区”链接，点击该链接后即可进入教师个人专区。\u003C\u002Fp\u003E\u003Cp class=\\\"ql-first2space-on ql-align-justify\\\"\u003E教师登录教师个人专区的账号、密码也可以用于登录以下页面：\u003C\u002Fp\u003E\u003Cp class=\\\"ql-first2space-on ql-align-justify\\\"\u003E(1) 每一届大赛从报名开始到下一届大赛启动之前，大赛官网将为各分赛区秘书长及各高校联系人分别开通分赛区秘书长工作台或高校联系人工作台。各分赛区秘书长及各高校联系人可以登录各自的工作台 (网站首页右上角的登录人姓名下方会出现“大赛管理系统”的链接)。这些工作台只在当届大赛期间对相关老师开放。\u003C\u002Fp\u003E\u003Cp class=\\\"ql-first2space-on ql-align-justify\\\"\u003E(2) 大赛秘书处目前正在持续进行金相大会题库建设。命题专家和评审专家可以登录系统提交或评审试题 (网站首页右上角的登录人姓名下方会出现“大赛题库系统”的链接)。\u003C\u002Fp\u003E\u003Chr size=\\\"1\\\"\u003E\u003Cp class=\\\"ql-first2space-on ql-align-justify\\\"\u003E\u003Cbr\u003E\u003C\u002Fp\u003E\"}]"}},"check_links_cache":{}}</script><script src="/js/vendor.98962a72.js" defer></script><script src="/js/app.44a5bc86.js" defer></script></body></html>
