
<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>“21世纪杯”全国英语演讲官方网站</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <script type="text/javascript" src="/inc/jquery.min.2.1.4.js"></script>

    <style>
        html {
            margin: 0px;
            padding: 0px;
            width: 100%;
            height: 100%;
            font-family: "微软雅黑", "黑体";
        }

        body {
            background: #fff;
            margin: 0px;
            padding: 0px;
            color: #333;
            font-family: "微软雅黑", "黑体", "Arial";
            font-size: 14px;
        }

        div {
            box-sizing: border-box;
        }

        .header {
            width: 100%;
            height: calc(100vw / 1.778);
            background: #021861 url("/images/2026/home.jpg") no-repeat center top;
            background-size: 100% 100%;
            margin: 0 auto;
            position: relative;
        }

        .group_btn {
            margin: 40px auto;
            height: 100px;
            width: 100%;
            max-width: 1200px;
            display: -webkit-flex;
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
            border: none;
        }

        a.guoji,
        a.qingnian,
        a.daxue,
        a.teens {
            display: inline-block;
            width: 263px;
            height: 100px;
            background-repeat: no-repeat;
            background-size: 100% auto;
            cursor: pointer;
            margin: 10px 20px 20px 20px;
            transition: transform 0.5s;
        }

        a.guoji {
            background-image: url("/images/2026/btn_guoji.png");
        }

        a.qingnian {
            background-image: url("/images/2026/btn_qingnian.png");
        }

        a.daxue {
            background-image: url("/images/2026/btn_daxue.png");
        }

        a.teens {
            background-image: url("/images/2026/btn_shetuan.png");
        }

        a.guoji:hover,
        a.qingnian:hover,
        a.daxue:hover,
        a.teens:hover {
            opacity: 0.8;
            transform: scale(1.1);
        }

        .daohang {
            width: 140px;
            background: #e05729;
            position: absolute;
            top: 2.2vw;
            right: 2.3vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 5px;
            z-index: 10;
        }

        .daohang a {
            width: 140px;
            height: 56px;
            font-size: 18px;
            color: #312320;
            margin: 0 auto;
            line-height: 55px;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
        }

        .daohang a:hover {
            color: #ffffff;
            cursor: pointer;
        }

        .border {
            width: 80px;
            height: 1px;
            margin: 0 auto;
            background: #312320;
        }

        @media (max-width: 768px) {
            .group_btn {
                margin: 40px auto;
                padding: 10px 10px;
            }

            a.guoji,
            a.qingnian,
            a.daxue,
            a.teens {
                margin: 10px 5px 20px 5px;
            }

            .daohang {
                display: none;
            }
        }
    </style>

</head>

<body>
    <div class="header"></div>
    <div class="group_btn">
        <a class="guoji" href='https://bresc.i21st.cn/' target='_blank' title="国际组"></a><a class="qingnian" href='/youth/' target='_blank' title="青年组"></a><a class="daxue" href='/college/' target='_blank' title="大学组"></a><!--<a class="teens" href='https://mp.weixin.qq.com/s/wLC1Y4lSBk_0IvYNU4qXXg' target='_blank' title="中小学社团活动"></a>-->
    </div>
    <div class="daohang">
        <a href="/article/final/2023/1.html" target="_blank">活动动态</a>
        <div class="border"></div>
        <a href="https://contest.21stcentury.com.cn/cert/public.html" target="_blank">证书查询</a>
    </div>
    <br clear="all" />
    <br />
    <script type="text/javascript" src="/inc/stats.baidu.js"></script>

</body>

</html>
