# 系统配置
system:
  name: "昇腾AI竞赛智能助教"
  version: "1.0.0"
  debug: false

# 知识库配置
knowledge_base:
  persist_dir: "./chroma_db"
  embedding_model: "BAAI/bge-large-zh-v1.5"
  chunk_size: 500
  chunk_overlap: 50
  top_k: 3

# 大模型配置
llm:
  model_id: "Qwen/Qwen2-1.5B-Instruct"  # 推荐配置，需约4GB显存
  device: "auto"  # auto, cuda, cpu, npu
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.9

# 昇腾NPU配置（可选）
ascend:
  enabled: false
  device_id: 0
  quantization: "int8"  # int8, int4, fp16
  batch_size: 4

# 服务配置
server:
  web_port: 8501
  api_port: 8000
  rag_port: 8001
  host: "0.0.0.0"
