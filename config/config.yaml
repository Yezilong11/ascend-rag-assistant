# 系统配置
system:
  name: "昇腾AI竞赛智能助教"
  version: "1.0.0"
  debug: false

# 知识库配置
knowledge_base:
  persist_dir: "./chroma_db"
  embedding_model: "BAAI/bge-large-zh-v1.5"
  chunk_size: 500
  chunk_overlap: 50
  top_k: 3

# 大模型配置
llm:
  model_id: "Qwen/Qwen2-1.5B-Instruct"  # 推荐配置，需约4GB显存
  device: "auto"  # auto, cuda, cpu, npu
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.9

# 昇腾NPU配置（可选）
ascend:
  enabled: false
  device_id: 0
  quantization: "int8"  # int8, int4, fp16
  batch_size: 4

# 服务配置
server:
  web_port: 8501
  api_port: 8000
  host: "0.0.0.0"

# 多模态RAG配置
multimodal:
  enabled: true
  vlm_model: "qwen-vl-2b"
  vlm_quantization: "int4"
  ocr_engine: "paddleocr"
  device_priority: "auto"

# 显存配置（8GB基准）
memory:
  total_mb: 8192
  gpu_reserved_mb: 3584
  vlm_required_mb: 1536
  cpu_memory_mb: 3072

# PDF处理配置
pdf:
  extract_images: true
  min_image_size: 100
  output_dir: "./temp_pdf_images"
  supported_types: [".pdf"]

# 向量数据库配置（多模态）
multimodal_vectorstore:
  persist_dir: "./chroma_db_multimodal"
  collection_name: "multimodal_image_chunks"
  embedding_model: "BAAI/bge-large-zh-v1.5"
