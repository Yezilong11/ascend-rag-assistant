services:
  ascend-rag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ascend-rag
    ports:
      - "${HOST_PORT:-8080}:80"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./skill_tree_data:/app/skill_tree_data
      - ./chroma_db:/app/chroma_db
    environment:
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - API_PORT=8000
      - RSS_PORT=8081
      - KMP_DUPLICATE_LIB_OK=TRUE
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
